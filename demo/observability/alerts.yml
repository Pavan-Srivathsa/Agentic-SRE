groups:
  - name: checkout
    rules:
      - alert: HighCheckoutLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="api-gateway",path="/checkout"}[1m]))) > 2
        for: 30s
        labels:
          severity: critical
          service: api-gateway
          alertname: HighCheckoutLatency
        annotations:
          summary: Checkout latency above SLO
          description: api-gateway p95 checkout latency exceeded 2 seconds.
