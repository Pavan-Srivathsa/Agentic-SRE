global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: orders
    static_configs:
      - targets: ["orders:8001"]
  - job_name: payments
    static_configs:
      - targets: ["payments:8002"]
  - job_name: inventory
    static_configs:
      - targets: ["inventory:8003"]
